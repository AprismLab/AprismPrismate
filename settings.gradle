// AprismPrismate - Gradle Settings
// Author: BlockConnect@StarsailsClover
//
// Prismate consumes the Aprism core modules (aprism-api, aprism-manifest,
// aprism-loader-core) from the sibling Aprism checkout via a composite build,
// so co-development never drifts from the embedded runtime.

pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.architectury.dev/' }
    }
}

// Auto-provision the Java 25 toolchain the neoforge module requires (FML 11
// jars are Java 25 bytecode). Local machines supply JDK 25 via
// org.gradle.java.installations.paths in gradle.properties; CI runners resolve
// it from the Foojay Disco API through this resolver (0.8.0 is incompatible
// with Gradle 9, so 1.0.0 is used).
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = 'https://maven.fabricmc.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.architectury.dev/' }
    }
}

// Composite build into the Aprism workspace. The version declared in the
// catalog is ignored while the sibling checkout is present; substitution
// binds directly to the Aprism subprojects.
includeBuild('../Aprism') {
    dependencySubstitution {
        substitute module('com.aprism:aprism-api') using project(':aprism-api')
        substitute module('com.aprism:aprism-manifest') using project(':aprism-manifest')
        substitute module('com.aprism:aprism-loader-core') using project(':aprism-loader-core')
    }
}

rootProject.name = 'AprismPrismate'

include ':common'
include ':fabric'
include ':neoforge'
include ':forge'
