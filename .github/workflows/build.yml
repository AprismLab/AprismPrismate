name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Prismate consumes the Aprism core via a composite build, so both
      # repositories must be checked out as siblings.
      - name: Checkout Aprism (sibling)
        uses: actions/checkout@v4
        with:
          repository: NDBlockConnect/Aprism
          path: ws/Aprism

      - name: Checkout AprismPrismate
        uses: actions/checkout@v4
        with:
          path: ws/AprismPrismate

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: ws/AprismPrismate
        run: ./gradlew build --console=plain

      - name: Upload Fabric artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: AprismPrismate-Fabric
          path: ws/AprismPrismate/fabric/build/libs/AprismPrismate-*.jar
          if-no-files-found: error

      - name: Upload NeoForge artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: AprismPrismate-NeoForge
          path: ws/AprismPrismate/neoforge/build/libs/AprismPrismate-*.jar
          if-no-files-found: error
