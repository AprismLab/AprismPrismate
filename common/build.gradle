// AprismPrismate :: common - shared bridge core
// Discovery, extraction, embedded runtime, lifecycle mapper, host bridge SPI.
// Depends on Aprism API (unrelocated) + Aprism manifest (relocated at shading).

plugins {
    id 'java-library'
}

dependencies {
    // Aprism core modules (substituted by the composite build)
    api libs.aprism.api
    api libs.aprism.manifest

    // JSON for Prismate's own config (bundled + relocated at shading time)
    api libs.gson

    // ASM for the Prismate-side access-widener bytecode pass (bundled +
    // relocated at shading time). The host loaders also ship ASM, so the
    // shaded copy is relocated to com.aprism.prismate.libs.asm.
    implementation 'org.ow2.asm:asm:9.9'

    // ASM is also needed by tests that synthesize jar-only entrypoints
    testImplementation 'org.ow2.asm:asm:9.9'
    testImplementation libs.bundles.testing
}

// ---------------------------------------------------------------------------
// Version-line consistency source set (v26.1-Alpha.1).
//
// Prismate's mirror of the Aprism JE version line must stay in lockstep with
// the upstream VersionLineRegistry. The consistency test needs the FULL
// Aprism loader-core on its classpath to compare against, but the main test
// suite must NOT: its AgentConflictDetector fallback probes the system
// classloader for com.aprism.loader.AprismRuntime, and in production that
// class is only ever present when the Aprism javaagent is attached (Prismate
// never embeds loader-core). Keeping the two classpaths separate preserves
// the detector's meaning in tests.
// ---------------------------------------------------------------------------
sourceSets {
    consistencyTest {
        java.srcDir 'src/consistencyTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    consistencyTestImplementation.extendsFrom testImplementation
    consistencyTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    consistencyTestImplementation libs.aprism.loader.core
}

tasks.register('consistencyTest', Test) {
    description = 'Verifies PrismateVersionLine stays in lockstep with the Aprism VersionLineRegistry'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.consistencyTest.output.classesDirs
    classpath = sourceSets.consistencyTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('consistencyTest')
}

// Generate prismate-build-info.properties so the runtime knows its own
// version, the embedded Aprism version, and the host loader pins without
// hardcoding them in source. Values are captured at configuration time so the
// task stays configuration-cache compatible.
def buildInfoValues = [
    prismateVersion: project.prismateVersion.toString(),
    embeddedAprismVersion: project.embeddedAprismVersion.toString(),
    minecraftEdition: project.minecraftEdition.toString(),
    minecraftVersion: project.minecraftVersion.toString(),
    fabricLoaderVersion: project.fabricLoaderVersion.toString(),
    fmlLoaderVersion: project.fmlLoaderVersion.toString(),
]
def generateBuildInfo = tasks.register('generateBuildInfo') {
    def outputDir = layout.buildDirectory.dir('generated/resources')
    outputs.dir(outputDir)
    inputs.property('info', buildInfoValues)
    doLast {
        def dir = outputDir.get().asFile
        dir.mkdirs()
        def file = new File(dir, 'prismate-build-info.properties')
        file.text = """\
# Generated by the common build script - do not edit
prismate.version=${buildInfoValues.prismateVersion}
prismate.embedded.aprism=${buildInfoValues.embeddedAprismVersion}
prismate.minecraft.edition=${buildInfoValues.minecraftEdition}
prismate.minecraft.version=${buildInfoValues.minecraftVersion}
prismate.pin.fabricloader=${buildInfoValues.fabricLoaderVersion}
prismate.pin.fml=${buildInfoValues.fmlLoaderVersion}
"""
    }
}

sourceSets.main.resources.srcDir(generateBuildInfo)
