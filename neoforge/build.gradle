// AprismPrismate :: neoforge - NeoForge entrypoint + classloader bridge
// Host loader APIs are provided at runtime by NeoForge (compileOnly).

plugins {
    id 'java-library'
    alias(libs.plugins.shadow)
}

dependencies {
    api project(':common')

    // Non-transitive: Prismate compiles only against the FML loader and the
    // event bus jars; all other NeoForge types are absent from the compile
    // surface by design (host-provided at runtime).
    compileOnly(libs.fml.loader) { transitive = false }
    compileOnly(libs.neoforge.bus) { transitive = false }
    testImplementation(libs.fml.loader) { transitive = false }
    testImplementation(libs.neoforge.bus) { transitive = false }
    testImplementation libs.bundles.testing
}

// Per-loader artifact: AprismPrismate-v26.0-Alpha.1-N-26.2.jar
shadowJar {
    archiveFileName = "AprismPrismate-${project.version}-N-${project.minecraftVersion}.jar"

    // Relocation rule (docs 01 Section 9.1): the embedded Aprism manifest
    // runtime is relocated; com.aprism.api is NOT relocated so mod jars bind
    // to the canonical API classes.
    relocate 'com.aprism.manifest', 'com.aprism.prismate.internal.manifest'
    relocate 'com.google.gson', 'com.aprism.prismate.libs.gson'

    mergeServiceFiles()
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'

    // Build-time check (docs 02 Section 6): com/aprism/api MUST remain
    // unrelocated in the shaded jar.
    doLast {
        def jarFile = archiveFile.get().asFile
        def foundApi = false
        def foundRelocatedApi = false
        java.util.jar.JarFile jar = new java.util.jar.JarFile(jarFile)
        try {
            jar.entries().each { e ->
                if (e.name.startsWith('com/aprism/api/')) {
                    foundApi = true
                }
                if (e.name.startsWith('com/aprism/prismate/internal/api/')
                        || e.name.contains('/internal/api/com/aprism/api/')) {
                    foundRelocatedApi = true
                }
            }
        } finally {
            jar.close()
        }
        if (!foundApi) {
            throw new GradleException("Shaded jar is missing com/aprism/api: "
                    + "the Aprism API classes must be embedded unrelocated")
        }
        if (foundRelocatedApi) {
            throw new GradleException("Shaded jar contains a relocated copy of "
                    + "com/aprism/api: the API package must NOT be relocated")
        }
    }
}

tasks.named('assemble') {
    dependsOn shadowJar
}
