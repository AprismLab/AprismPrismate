// AprismPrismate :: forge - Forge (classic) stub
//
// DECISION-1 (FACT.md Section 4): the Alpha line ships Fabric + NeoForge
// first. This module is a compiling stub that reserves the MultiLoader slot
// and the -Fo- artifact naming; it refuses to boot with a visible error if
// ever loaded. Forge enters scope no earlier than v26.0-Alpha.5.

plugins {
    id 'java-library'
}

dependencies {
    api project(':common')

    // DECISION-1 (FACT.md): Forge (classic) is deferred post-1.0; this stub
    // refuses to boot and uses only java.util.logging, so it needs NO host
    // loader compile dependencies. (Classic Forge uses net.minecraftforge, not
    // NeoForge's fancymodloader; the real Forge deps will be added when Forge
    // scope actually lands.) Keeping the module dependency-free lets it
    // compile on the standard JVM 21 toolchain in CI.
    testImplementation libs.bundles.testing
}
