# AprismPrismate - Gradle Properties
# Author: BlockConnect@StarsailsClover

# Prismate version (public): v<Year>.<minor>[-Alpha.<n>] (mirrors Aprism)
prismateVersion = v26.7-Alpha.4
# Internal phase tracker (not shown in public version strings)
prismatePhase = Phase0
prismateGroup = com.aprism.prismate

# Embedded Aprism core version (same minor line per docs 01 Section 10.3).
# With the composite build the code comes from the sibling checkout; this
# value is the pin used for mavenLocal fallback and for the `aprism`
# environment id injected into dependency resolution (OPEN-1 interim).
embeddedAprismVersion = v26.6

# Aprism commit Prismate was last verified against (v26.4 GA upstream
# sync discipline). tools/upstream/check_upstream_drift.sh compares the
# sibling checkout's HEAD against this pin and re-runs the suite on drift.
aprismSyncPin = 4dd46b74c277fce2e46e960a46127bccd5f3e9a1

# Minecraft target (Alpha line targets MC 26.2; unobfuscated, no remap)
minecraftEdition = JE
minecraftVersion = 26.2

# Java target (Java 21 toolchain; MC 26.2 runs on newer JVMs at runtime)
javaVersion = 21

# Host loader pins (compile-time API surface)
fabricLoaderVersion = 0.16.14
fmlLoaderVersion = 11.0.16
neoforgeBusVersion = 8.0.5

# Gradle / JVM settings
org.gradle.jvmargs = -Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true

# JDK 25 location (required by the neoforge module toolchain; MC 26.2 runs on Java 25)
org.gradle.java.installations.paths = C:/Users/Sails/Java/jdk-25.0.3+9
